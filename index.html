<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="A simple Kanban board for projects run by you and your agents.">
  <meta name="theme-color" content="#f6f7f3">
  <title>kanban.cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main class="centered-view">
      <div class="brand-lockup"><span class="brand-dot" aria-hidden="true"></span><strong>kanban.cards</strong></div>
      <p class="quiet">Opening your projects…</p>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <p class="noscript-message">kanban.cards needs JavaScript to show and update your projects.</p>
  </noscript>
  <script src="app.js"></script>

</html>
