name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, build, UI contract, and release policy
        run: npm run check

      - name: Run tests
        run: npm test

  native-ios:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native unit and UI tests
        run: |
          xcodebuild -project ios/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -derivedDataPath .local/ios/DerivedData \
            -resultBundlePath .local/ios/NativeTests.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='' test

      - name: Upload failed native test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-results
          path: .local/ios/NativeTests.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  native-macos:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native Mac unit tests
        run: |
          xcodebuild -project macos/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .local/macos/DerivedData \
            -resultBundlePath .local/macos/NativeTests.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS= -only-testing:KanbanCardsTests test

      - name: Build Mac Release configuration
        run: |
          xcodebuild -project macos/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Release -destination 'platform=macOS' \
            -derivedDataPath .local/macos/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS= build

      - name: Upload failed native Mac test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-results
          path: .local/macos/NativeTests.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
