name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, build, UI contract, and release policy
        run: npm run check

      - name: Run tests
        run: npm test

  native-ios-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, creation]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Boot an isolated iPhone simulator
        id: simulator
        timeout-minutes: 5
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p .local/ios/bootstrap
          xcodebuild -version > .local/ios/bootstrap/xcode-version.txt
          xcrun simctl list runtimes --json > .local/ios/bootstrap/runtimes.json
          simulator_id=$(xcrun simctl create \
            "KanbanCards-${TEST_SUITE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b 2>&1 | tee .local/ios/bootstrap/bootstatus.log

      - name: Run native unit and UI tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          if [ "$TEST_SUITE" = creation ]; then
            test_selection='-only-testing:KanbanCardsUITests/CreationFlowTests'
          else
            test_selection='-skip-testing:KanbanCardsUITests/CreationFlowTests'
          fi
          xcodebuild -project ios/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .local/ios/DerivedData \
            -resultBundlePath ".local/ios/$TEST_SUITE.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='' \
            "$test_selection" test

      - name: Upload failed native test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-${{ matrix.suite }}-results
          path: |
            .local/ios/${{ matrix.suite }}.xcresult
            .local/ios/bootstrap
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the CI-owned simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID" || true

  native-ios:
    if: always()
    needs: [native-ios-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every iPhone test suite to pass
        env:
          NATIVE_IOS_RESULT: ${{ needs.native-ios-tests.result }}
        run: test "$NATIVE_IOS_RESULT" = success

  native-macos:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native Mac unit tests
        run: |
          xcodebuild -project macos/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .local/macos/DerivedData \
            -resultBundlePath .local/macos/NativeTests.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS= -only-testing:KanbanCardsTests test

      - name: Build Mac Release configuration
        run: |
          xcodebuild -project macos/KanbanCards.xcodeproj \
            -scheme KanbanCards -configuration Release -destination 'platform=macOS' \
            -derivedDataPath .local/macos/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS= build

      - name: Upload failed native Mac test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-results
          path: .local/macos/NativeTests.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
