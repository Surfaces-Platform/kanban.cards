name: Release policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release policy
        run: npm run check:release-policy

      - name: Test release gate
        run: node --import tsx --test tests/release-gate.test.ts
